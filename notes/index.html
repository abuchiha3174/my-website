<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Notes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <header class="top">
    <h1>Notes</h1>
    <span id="status" class="status"></span>
  </header>

  <section class="composer">
    <textarea id="new-note" placeholder="Write a note…" rows="3"></textarea>
    <div class="composer-row">
      <span class="hint">Saves straight to GitHub — same file on every device.</span>
      <button id="save-new" class="btn">Add note</button>
    </div>
  </section>

  <section id="list" class="list"></section>

  <p id="empty" class="empty" hidden>No notes yet — add your first one above.</p>

</div>

<script src="js/main.js"></script>
</body>
</html>
